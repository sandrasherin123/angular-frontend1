<div class="container">
    <form #regform="ngForm" (ngSubmit)="regdata(regform.value)">
        <div>
            <label >Name :  </label>
            <input type="text" name="name" ngModel placeholder="Enter your name">
        </div>
        <div>
            <label >Age :  </label>
            <input type="text" name="age" ngModel placeholder="Enter your age">
        </div>
        <div>
            <button class="btn btn-primary" type="submit">Register</button>
        </div>
    </form>
</div>

<div class="container" *ngIf="student">
    <form #updateform="ngForm" (ngSubmit)="updatedata(updateform.value)">
        <div>
            <label >ID :  </label>
            <input type="hidden" name="id" ngModel [(ngModel)]="student.id">
        </div>
        <div>
            <label >Name :  </label>
            <input type="text" name="name" ngModel [(ngModel)]="student.name">
        </div>
        <div>
            <label >Age :  </label>
            <input type="text" name="age" ngModel [(ngModel)]="student.age">
        </div>
        <div>
            <button type="submit">Update</button>
        </div>
    </form>
</div>

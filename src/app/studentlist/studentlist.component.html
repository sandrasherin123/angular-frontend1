<div>
    <table class="table table-striped">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Age</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
        <tr *ngFor="let student of student">
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.age }}</td>
            <td><button class="btn btn-primary" (click)="editdata(student.id)">Edit</button></td>
            <td><button class="btn btn-danger" (click)="deletedata(student.id)">Delete</button></td>

        </tr>
    </table>
</div>
